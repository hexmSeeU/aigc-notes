<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1881" viewBox="0 0 320 1881" role="img" aria-labelledby="title desc">
<title id="title">H3 视频 VAE Encoder 整体结构</title><desc id="desc">17 帧片段内部的逻辑尺寸。图到 48 通道 moments 为止，尚未执行整段视频裁尾及通道选择。</desc>
