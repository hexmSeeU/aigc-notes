<text x="160.0" y="1672" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#203a35">quant_conv P：48→48</text>
<text x="160.0" y="1695" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#203a35">[1,48,5,30,52]</text>
<text x="160" y="1760" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#203a35">A：kernel=3，stride=1</text>
<text x="160" y="1782" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#203a35">D：kernel=3，stride 见节点</text>
<text x="160" y="1804" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#203a35">P：kernel=1，stride=1</text>
<text x="160" y="1826" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#203a35">完整时空 padding 见正文参数表</text>
<text x="160" y="1848" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#203a35">此图不包含整段视频的全局裁尾</text>
